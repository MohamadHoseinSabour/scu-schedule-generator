version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: scu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scu_user
      POSTGRES_PASSWORD: scu_secure_password
      POSTGRES_DB: scu_schedule
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scu_user -d scu_schedule"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: scu_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
    command: ["python", "-m", "app.main"]

  api:
    build: .
    container_name: scu_admin_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
    command: ["uvicorn", "app.admin.routes:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: .
    container_name: scu_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
    command: ["celery", "-A", "app.workers.tasks", "worker", "--loglevel=info", "-c", "2"]

volumes:
  postgres_data:
  redis_data:
  storage_data:
